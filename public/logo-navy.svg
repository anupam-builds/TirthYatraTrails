<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 100 560 420" width="100%" height="100%">
  <defs>
    <!-- Sun Gradient -->
    <linearGradient id="origSun2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Mountain Gradients -->
    <linearGradient id="origMtn1_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f294a" />
    </linearGradient>

    <linearGradient id="origMtn2_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f294a" />
    </linearGradient>

    <!-- Flowing Wave Gradient -->
    <linearGradient id="origWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f294a" />
    </linearGradient>
  </defs>

  <g id="tirth-yatra-trails-original">
    <!-- 1. Top Flight Arc & Airplane -->
    <path
      d="M 100 320 A 205 205 0 0 1 485 240"
      fill="none"
      stroke="#0f294a"
      stroke-width="3"
      stroke-linecap="round"
    />

    <!-- Flight dashed contrail to plane -->
    <path
      d="M 445 160 Q 430 170 410 185"
      fill="none"
      stroke="#0f294a"
      stroke-width="1.8"
      stroke-dasharray="3,3"
      opacity="0.75"
    />

    <!-- Airplane silhouette -->
    <g transform="translate(425, 142) rotate(-22) scale(0.95)" fill="#0f294a">
      <path d="M 0 0 C 15 -3 45 -2 52 0 C 45 2 15 3 0 0 Z" />
      <path d="M 22 -1 L 10 -22 L 18 -22 L 32 -1 Z" />
      <path d="M 24 1 L 14 18 L 22 18 L 34 1 Z" />
      <path d="M 3 -1 L -4 -11 L 2 -11 L 9 -1 Z" />
      <circle cx="20" cy="0" r="0.7" fill="#ffffff" />
      <circle cx="24" cy="0" r="0.7" fill="#ffffff" />
      <circle cx="28" cy="0" r="0.7" fill="#ffffff" />
      <circle cx="32" cy="0" r="0.7" fill="#ffffff" />
      <circle cx="36" cy="0" r="0.7" fill="#ffffff" />
    </g>

    <!-- 2. Birds in Sky (Left of Sun) -->
    <g fill="#0f294a" opacity="0.9">
      <path d="M 172 185 Q 179 179 186 183 Q 193 179 200 185 Q 193 182 186 186 Q 179 182 172 185 Z" transform="scale(0.85) translate(30, 30)" />
      <path d="M 205 168 Q 211 163 217 167 Q 223 163 229 168 Q 223 165 217 169 Q 211 165 205 168 Z" transform="scale(0.8) translate(50, 45)" />
      <path d="M 230 195 Q 235 190 240 193 Q 245 190 250 195 Q 245 193 240 196 Q 235 193 230 195 Z" transform="scale(0.75) translate(75, 65)" />
    </g>

    <!-- 3. Vibrant Sun (Center) -->
    <circle cx="304" cy="180" r="65" fill="url(#origSun2)" />

    <!-- 4. Majestic Blue Mountain Range with Snow Caps -->
    <polygon points="120,320 225,215 310,320" fill="url(#origMtn1_2)" />
    <polygon points="340,320 420,200 495,320" fill="url(#origMtn1_2)" />

    <polygon points="140,320 295,160 380,320" fill="url(#origMtn2_2)" />
    <polygon points="260,320 375,190 480,320" fill="url(#origMtn1_2)" />

    <!-- Mountain Snow Highlights -->
    <polygon points="295,160 278,205 292,200 285,225 295,215 310,240 305,210 325,195" fill="#ffffff" opacity="0.95" />
    <polygon points="295,160 325,195 345,220 320,225 330,245 305,245 295,215" fill="#e0f2fe" opacity="0.85" />
    <polygon points="225,215 210,245 222,242 215,260 232,250 240,230" fill="#ffffff" opacity="0.9" />
    <polygon points="420,200 405,230 418,228 412,245 428,235 435,220" fill="#ffffff" opacity="0.9" />
    <polygon points="375,190 360,225 372,222 368,245 385,235 395,215" fill="#ffffff" opacity="0.9" />

    <!-- 5. Silhouettes of Pilgrims, Temples, and Nature -->
    <g fill="#0f294a">
      <!-- Pilgrim with Backpack and Staff -->
      <g id="pilgrim-silhouette" transform="translate(136, 252)">
        <circle cx="15" cy="5" r="3.2" />
        <path d="M 12 4 L 20 4" stroke="#0f294a" stroke-width="1.2" stroke-linecap="round" />
        <path d="M 13 8 L 17 18 L 12 28 L 8 40" stroke="#0f294a" stroke-width="3" stroke-linecap="round" />
        <path d="M 17 18 L 22 28 L 23 40" stroke="#0f294a" stroke-width="3" stroke-linecap="round" />
        <rect x="7" y="9" width="6" height="11" rx="2" fill="#0f294a" />
        <line x1="24" y1="14" x2="26" y2="42" stroke="#0f294a" stroke-width="1.8" stroke-linecap="round" />
        <path d="M 15 11 L 22 17 L 24 15" fill="none" stroke="#0f294a" stroke-width="1.8" stroke-linecap="round" />
      </g>

      <!-- Left Temple (Classical Shikhara) -->
      <g id="temple-left" transform="translate(182, 230)">
        <rect x="0" y="55" width="40" height="25" rx="1" />
        <path d="M 6 55 L 12 30 L 28 30 L 34 55 Z" />
        <path d="M 12 30 L 16 15 L 24 15 L 28 30 Z" />
        <ellipse cx="20" cy="13" rx="5" ry="2.5" />
        <line x1="20" y1="13" x2="20" y2="4" stroke="#0f294a" stroke-width="1.5" />
        <circle cx="20" cy="4" r="1.5" />
        <path d="M 14 80 L 14 65 Q 20 60 26 65 L 26 80 Z" fill="#ffffff" />
        <line x1="7" y1="56" x2="7" y2="80" stroke="#ffffff" stroke-width="1.5" />
        <line x1="33" y1="56" x2="33" y2="80" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- Mid-Shrine with Flag -->
      <g id="temple-mid" transform="translate(224, 245)">
        <rect x="0" y="40" width="30" height="25" />
        <path d="M 4 40 L 10 20 L 20 20 L 26 40 Z" />
        <polygon points="10,20 15,10 20,20" />
        <line x1="15" y1="10" x2="15" y2="2" stroke="#0f294a" stroke-width="1.5" />
        <path d="M 15 2 Q 22 4 28 2 Q 23 7 15 8 Z" fill="#ea580c" />
        <path d="M 10 65 L 10 52 Q 15 47 20 52 L 20 65 Z" fill="#ffffff" />
      </g>

      <!-- Grand Central Sanctum (Kedarnath / Jagannath) -->
      <g id="temple-grand-center" transform="translate(258, 175)">
        <path d="M 10 135 L 16 35 C 22 28 48 28 54 35 L 60 135 Z" />
        <rect x="2" y="110" width="66" height="30" rx="1" />
        
        <line x1="23" y1="42" x2="21" y2="108" stroke="#ffffff" stroke-width="1.4" />
        <line x1="35" y1="36" x2="35" y2="108" stroke="#ffffff" stroke-width="1.8" />
        <line x1="47" y1="42" x2="49" y2="108" stroke="#ffffff" stroke-width="1.4" />

        <line x1="18" y1="52" x2="52" y2="52" stroke="#ffffff" stroke-width="1.2" />
        <line x1="16" y1="72" x2="54" y2="72" stroke="#ffffff" stroke-width="1.2" />
        <line x1="13" y1="92" x2="57" y2="92" stroke="#ffffff" stroke-width="1.2" />

        <ellipse cx="35" cy="32" rx="13" ry="5" fill="#0f294a" stroke="#ffffff" stroke-width="1" />
        <ellipse cx="35" cy="26" rx="9" ry="3.5" fill="#0f294a" />
        <circle cx="35" cy="20" r="3.5" fill="#0f294a" />
        <line x1="35" y1="20" x2="35" y2="3" stroke="#0f294a" stroke-width="2" />
        
        <path
          d="M 35 3 Q 48 8 58 4 Q 50 13 35 15 Z"
          fill="#ea580c"
          stroke="#c2410c"
          stroke-width="0.5"
        />

        <path d="M 22 140 L 22 116 Q 35 106 48 116 L 48 140 Z" fill="#ffffff" />
        <path d="M 26 140 L 26 122 Q 35 115 44 122 L 44 140 Z" fill="#0f294a" />
        <circle cx="35" cy="128" r="2" fill="#ffffff" />

        <path d="M 30 75 L 30 65 Q 35 60 40 65 L 40 75 Z" fill="#ffffff" />
        <path d="M 32 75 L 32 67 Q 35 63 38 67 L 38 75 Z" fill="#0f294a" />
      </g>

      <!-- Right Heritage Mandapa -->
      <g id="temple-right" transform="translate(338, 238)">
        <polygon points="0,40 40,15 80,40" />
        <rect x="5" y="40" width="70" height="35" />
        
        <circle cx="40" cy="38" r="9" fill="#ffffff" />
        <circle cx="40" cy="38" r="6" fill="#0f294a" />
        <circle cx="40" cy="38" r="2" fill="#ffffff" />
        
        <path d="M 30 75 L 30 56 Q 40 50 50 56 L 50 75 Z" fill="#ffffff" />
        <path d="M 34 75 L 34 60 Q 40 54 46 60 L 46 75 Z" fill="#0f294a" />

        <path d="M 12 70 L 12 55 Q 18 50 24 55 L 24 70 Z" fill="#ffffff" />
        <path d="M 14 70 L 14 57 Q 18 53 22 57 L 22 70 Z" fill="#0f294a" />

        <path d="M 56 70 L 56 55 Q 62 50 68 55 L 68 70 Z" fill="#ffffff" />
        <path d="M 58 70 L 58 57 Q 62 53 66 57 L 66 70 Z" fill="#0f294a" />

        <line x1="40" y1="15" x2="40" y2="8" stroke="#0f294a" stroke-width="1.8" />
        <circle cx="40" cy="8" r="1.5" />
      </g>

      <!-- Himalayan Pines -->
      <g id="pine-trees" transform="translate(425, 222)">
        <g transform="translate(30, 0)">
          <polygon points="12,0 3,25 21,25" />
          <polygon points="12,18 0,46 24,46" />
          <polygon points="12,38 -4,70 28,70" />
          <polygon points="12,58 -8,92 32,92" />
        </g>
        <g transform="translate(10, 32)">
          <polygon points="10,0 2,20 18,20" />
          <polygon points="10,14 -1,38 21,38" />
          <polygon points="10,30 -4,58 24,58" />
        </g>
        <g transform="translate(56, 45)">
          <polygon points="8,0 2,16 14,16" />
          <polygon points="8,11 0,30 16,30" />
          <polygon points="8,24 -2,45 18,45" />
        </g>
      </g>
    </g>

    <!-- 6. Ground Base Horizon -->
    <path
      d="M 85 320 L 515 320"
      stroke="#0f294a"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- 7. Flowing Sacred River Waves -->
    <path
      d="M 80 326 C 160 334 260 355 350 340 C 420 328 480 340 515 352 C 480 344 420 334 350 346 C 260 361 160 340 80 332 Z"
      fill="url(#origWave2)"
    />
    <path
      d="M 120 335 C 200 342 280 360 370 346 C 430 336 475 345 505 352"
      fill="none"
      stroke="#38bdf8"
      stroke-width="2.5"
      opacity="0.95"
      stroke-linecap="round"
    />

    <!-- 8. Typography: Tirth Yatra Trails.in -->
    <g transform="translate(300, 415)" text-anchor="middle">
      <text
        font-family="'Cinzel', 'Georgia', 'Playfair Display', serif"
        font-size="62"
        font-weight="800"
        letter-spacing="-0.5"
      >
        <tspan fill="#0f294a">Tirth</tspan>
        <tspan font-size="28"> </tspan>
        <tspan fill="#ea580c">Yatra</tspan>
        <tspan font-size="28"> </tspan>
        <tspan fill="#0f294a">Trails</tspan>
        <tspan fill="#ea580c" font-size="44" font-weight="800">.in</tspan>
      </text>
    </g>

    <!-- 9. Tagline Section with Divider Rules and Accent Dots -->
    <g transform="translate(0, 452)">
      <line x1="45" y1="0" x2="105" y2="0" stroke="#0f294a" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="112" cy="0" r="3.5" fill="#ea580c" />

      <text
        x="300"
        y="4"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="11.5"
        font-weight="800"
        letter-spacing="3"
        fill="#0f294a"
      >
        DIVINE JOURNEYS, MEMORABLE EXPERIENCES
      </text>

      <circle cx="488" cy="0" r="3.5" fill="#ea580c" />
      <line x1="495" y1="0" x2="555" y2="0" stroke="#0f294a" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- 10. Sacred Symmetrical Lotus Motif at the Base -->
    <g transform="translate(300, 488)">
      <path
        d="M 0 -22 C -7 -10 -7 -2 0 6 C 7 -2 7 -10 0 -22 Z"
        fill="#ea580c"
      />
      <circle cx="0" cy="14" r="3.2" fill="#0f294a" />

      <path
        d="M -5 2 C -18 -8 -26 -1 -30 3 C -23 10 -12 8 -2 5 Z"
        fill="#0f294a"
      />
      <path
        d="M -3 6 C -12 6 -20 12 -23 17 C -16 19 -8 15 -1 9 Z"
        fill="#0f294a"
      />

      <path
        d="M 5 2 C 18 -8 26 -1 30 3 C 23 10 12 8 2 5 Z"
        fill="#0f294a"
      />
      <path
        d="M 3 6 C 12 6 20 12 23 17 C 16 19 8 15 1 9 Z"
        fill="#0f294a"
      />
    </g>
  </g>
</svg>
